<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./src/assets/LOGO1.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MunchkinKittie | Hand-Raised Munchkin Kittens in Owego, NY</title>
    <meta
      name="description"
      content="Discover home-raised, veterinary-certified Munchkin kittens in Owego, NY. Browse available kittens, view multi-photo profiles, and apply for adoption with nationwide delivery."
    />

    <!-- Google Fonts: Cormorant Garamond, Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400;1,600&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg-canvas: #faf8f5;
        --bg-subtle: #f3efea;
        --bg-stone: #e8e1d5;
        --bg-surface: #ffffff;
        --bg-dark: #181615;
        --text-primary: #181615;
        --text-secondary: #575049;
        --text-muted: #8a8075;
        --accent-bronze: #9e5a3c;
        --accent-bronze-hover: #84472c;
        --accent-sage: #263b30;
        --border-subtle: rgba(24, 22, 21, 0.09);
      }

      html,
      body {
        margin: 0;
        padding: 0;
        overflow-x: hidden;
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background-color: var(--bg-canvas);
        color: var(--text-primary);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      #preloader {
        position: fixed;
        inset: 0;
        background: #faf8f5;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        transition: opacity 0.25s ease-out, visibility 0.25s;
      }

      .loader-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }

      .ring {
        width: 34px;
        height: 34px;
        border: 2px solid rgba(24, 22, 21, 0.08);
        border-top: 2px solid #181615;
        border-right: 2px solid #9e5a3c;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .loader-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="preloader">
      <div class="loader-content">
        <div class="ring"></div>
        <p
          style="
            color: #181615;
            font-weight: 600;
            font-size: 11px;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            margin: 0;
          "
        >
          MunchkinKittie · Owego, NY
        </p>
      </div>
    </div>

    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>

    <script>
      window.addEventListener('load', () => {
        const loader = document.getElementById('preloader');
        if (loader) {
          setTimeout(() => {
            loader.classList.add('loader-hidden');
          }, 220);
        }
      });
    </script>
  </body>
</html>
